# compose の web コンテナの nginx。ビルドした画面を配り、/api を FastAPI(server:8000)に中継する。
#
# HTTPS は VPS の既存の nginx で終端する前提で、この nginx は内側で HTTP を受ける(compose は
# 127.0.0.1 にだけ公開する)。外側の nginx は `proxy_set_header X-Real-IP $remote_addr;` で
# 利用者の IP アドレスを渡すこと。サーバーの回数制限はこの X-Real-IP だけを信じる。

# 外側の nginx(同じ機械や Docker のネットワーク)から来た接続だけ、X-Real-IP を接続元として扱う。
# 外から直接この nginx に来る接続の X-Real-IP は信じない(compose は 127.0.0.1 にだけ公開する)
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# アクセスログは残さない(IP アドレスをここにも残さないため。サーバーも --no-access-log)
access_log off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # サンプル GTFS(ZIP)の大きさに足りる上限。画面からは GTFS を送らない
    client_max_body_size 5m;

    # server コンテナだけを作り直して IP アドレスが変わっても追従できるよう、Docker の DNS で引き直す
    # (proxy_pass に変数を使うと、nginx は起動時ではなく要求のたびに名前を引く)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For は付けない・読まない(サーバーは X-Real-IP だけを信じる)
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
    }

    # AI の会話のストリーム(SSE)。ためずに流し、長く開いたままにする
    location = /api/claude/session/stream {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    # ビルドで名前にハッシュが付くファイルは長く覚えさせる
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 画面は1ページ(#/about などのハッシュで切り替える)。index.html は毎回確かめさせる
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
